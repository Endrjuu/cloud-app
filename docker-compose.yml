version: '3.9'

services:

  frontend:
    image: node:20
    container_name: frontend
    ports:
      - "5173:5173"
    command: sleep infinity

  backend:
    image: node:20
    container_name: backend
    ports:
      - "3000:3000"
    command: sleep infinity
    depends_on:
      - db

  db:
    image: postgres
    container_name: database
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: studyplanner
    ports:
      - "5432:5432"