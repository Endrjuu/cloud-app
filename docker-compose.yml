version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: studyplanner-db
    environment:
      POSTGRES_DB: studyplanner
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: studyplanner-backend
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: studyplanner
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: studyplanner-frontend
    ports:
      - "8080:80"
    environment:
      VITE_API_URL: http://localhost:8081
    depends_on:
      - backend

volumes:
  pgdata:
